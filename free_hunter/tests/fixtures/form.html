<!doctype html><html><head><meta charset="utf-8"><title>応募フォーム</title></head><body>
<form action="/submit" method="post" onsubmit="window.__submitted=true; return false;">
<table>
<tr><th>お名前（姓）</th><td><input type="text" name="sei"></td></tr>
<tr><th>お名前（名）</th><td><input type="text" name="mei"></td></tr>
<tr><th>フリガナ（セイ）</th><td><input type="text" name="kana_sei"></td></tr>
<tr><th>フリガナ（メイ）</th><td><input type="text" name="kana_mei"></td></tr>
<tr><th>メールアドレス</th><td><input type="email" name="email"></td></tr>
<tr><th>メールアドレス（確認）</th><td><input type="email" name="email_confirm"></td></tr>
<tr><th>郵便番号</th><td><input name="zip1" size="3">-<input name="zip2" size="4"></td></tr>
<tr><th>都道府県</th><td><select name="pref"><option value="">選択</option><option value="13">東京都</option><option value="27">大阪府</option></select></td></tr>
<tr><th>住所</th><td><input name="address"></td></tr>
<tr><th>電話番号</th><td><input name="tel1">-<input name="tel2">-<input name="tel3"></td></tr>
<tr><th>ご意見</th><td><textarea name="comment"></textarea></td></tr>
<tr><th>規約に同意</th><td><input type="checkbox" name="agree"></td></tr>
</table>
<button type="submit">応募する</button>
</form></body></html>
