# FREE HUNTER: スマホから「応募した」「当選した」「非表示」を記録する
# GitHub アプリ → Actions → このワークフロー → Run workflow → 入力して実行
# ※公開リポジトリでは応募・当選の記録は行いません（誰でも見られるため）。非表示のみ可能です。
name: FREE HUNTER 記録

on:
  workflow_dispatch:
    inputs:
      action:
        description: "何を記録するか"
        type: choice
        options: [applied, won, hide]
        default: applied
      ids:
        description: "案件ID（一覧の ID 列。複数はスペース区切り）"
        required: true
      value:
        description: "当選時の賞品価値（円・任意）"
        required: false

permissions:
  contents: write

concurrency:
  group: freehunter-data
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: free_hunter
    env:
      FH_DB: ${{ github.workspace }}/fh-data/freehunter.db
      FH_PROFILE_PREFECTURE: ${{ vars.FH_PROFILE_PREFECTURE }}
      FH_PROFILE_AGE: ${{ vars.FH_PROFILE_AGE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTION: ${{ inputs.action }}
      IDS: ${{ inputs.ids }}
      VALUE: ${{ inputs.value }}
      IS_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: free_hunter/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: scripts/ci_data_branch.sh load
      - name: 記録
        run: |
          if [ "$IS_PRIVATE" != "true" ] && [ "$ACTION" != "hide" ]; then
            echo "::error::公開リポジトリのため応募・当選は記録しません。リポジトリを非公開にしてから使ってください。"
            exit 1
          fi
          for id in $IDS; do
            case "$id" in (*[!0-9]*|'') echo "::error::IDは数字で入力してください: $id"; exit 1;; esac
            if [ "$ACTION" = "won" ] && [ -n "$VALUE" ]; then
              python -m freehunter won "$id" --value "$VALUE"
            else
              python -m freehunter "$ACTION" "$id"
            fi
          done
          python -m freehunter score
      - run: python -m freehunter report --out "${{ github.workspace }}/fh-data/README.md" ${{ github.event.repository.private && '--history' || '' }}
      - run: scripts/ci_data_branch.sh save
